version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-task-app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html/project-task-app
      - ./apache/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
    entrypoint: ["/bin/sh", "-c", "./init.sh apache2-foreground"]
    depends_on:
      - db

  db:
    image: mysql:latest
    container_name: mysql
    hostname: mysql
    tty: true
    ports:
      - "5051:3306"
    volumes:
      - ./mysql/mysqldata:/var/lib/mysql:rw
      - ./mysql/conf/my.cnf:/etc/mysql/my.cnf:rw
    environment:
      MYSQL_DATABASE: project_task_app
      MYSQL_ROOT_PASSWORD: mysql_root_password
      SERVICE_NAME: mysql
