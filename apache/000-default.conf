<VirtualHost *:80>
    DocumentRoot "/var/www/html/project-task-app/public"
    ServerName "project-task-app"
    <Directory "/var/www/html/project-task-app/public">
        Order allow,deny
        Allow From All
        AllowOverride All

        # use mod_rewrite for pretty URL support
        RewriteEngine on
        # If a directory or a file exists, use the request directly 
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        # Otherwise forward the request to index.php
        RewriteRule . index.php
    </Directory>
</VirtualHost>

